[project]
name = "opensoar-sdk"
version = "0.1.0"
description = "Python SDK for building OpenSOAR integrations and playbooks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensoar_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
